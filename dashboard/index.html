<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070909" />
    <title>Intcom Service Desk · Ticket Triage</title>
    <script>
      // Apply the saved theme, or the system preference, before first paint.
      (() => {
        const saved = localStorage.getItem("service-desk-theme");
        const light = saved ? saved === "light" : matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.dataset.theme = light ? "light" : "dark";
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", light ? "#eceeed" : "#070909");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
