<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1100" width="980" height="1100" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How a ticket gets classified</title>
  <desc id="d">A new Jira ticket goes through six steps. An algorithm finds similar past cases; the LLM reads the ticket and picks work type, service, urgency, impact and resolution status; fixed rules derive team, priority and assignee; an algorithm scores confidence and picks a lane; the LLM drafts the resolution note; a human agent reviews it unless the ticket is in the auto-apply lane. The result is written back to Jira.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="1100" rx="18" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- Header and legend -->
  <text x="40" y="52" font-size="24" font-weight="700" fill="#0f172a">How a ticket gets classified</text>
  <text x="40" y="78" font-size="14" fill="#475569">Six steps per ticket. The colour of each step shows who does the work.</text>

  <rect x="40" y="99" width="16" height="16" rx="4" fill="#7c3aed"/>
  <text x="64" y="112" font-size="13" fill="#0f172a"><tspan font-weight="700">LLM</tspan> — reads and writes free text</text>
  <rect x="290" y="99" width="16" height="16" rx="4" fill="#2563eb"/>
  <text x="314" y="112" font-size="13" fill="#0f172a"><tspan font-weight="700">Algorithm</tspan> — fixed rules and maths, same result every time</text>
  <rect x="730" y="99" width="16" height="16" rx="4" fill="#b45309"/>
  <text x="754" y="112" font-size="13" fill="#0f172a"><tspan font-weight="700">Human</tspan> — has the final say</text>

  <!-- Reference data column header -->
  <text x="690" y="162" font-size="15" font-weight="700" fill="#0f172a">Reference data</text>
  <text x="690" y="182" font-size="12.5" fill="#64748b">prepared before any ticket arrives,</text>
  <text x="690" y="199" font-size="12.5" fill="#64748b">mostly mined from 20,000 past tickets</text>

  <!-- Input: new Jira ticket -->
  <rect x="110" y="140" width="520" height="52" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="134" y="163" font-size="15" font-weight="700" fill="#0f172a">New Jira ticket</text>
  <text x="134" y="182" font-size="13" fill="#334155">title, description, comments; some fields are wrong on purpose</text>

  <line x1="370" y1="193" x2="370" y2="233" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="382" y="218" font-size="12" fill="#475569">description + comments (title ignored)</text>

  <!-- Step 1: similarity search (algorithm) -->
  <rect x="110" y="236" width="520" height="70" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="134" cy="261" r="13" fill="#2563eb"/>
  <text x="134" y="265.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="156" y="266" font-size="15" font-weight="700" fill="#0f172a">Find similar past cases</text>
  <text x="156" y="288" font-size="13" fill="#334155">embedding model + cosine similarity search</text>
  <rect x="522" y="248" width="96" height="22" rx="11" fill="#2563eb"/>
  <text x="570" y="263" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">ALGORITHM</text>

  <line x1="370" y1="307" x2="370" y2="347" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="382" y="332" font-size="12" fill="#475569">3 closest past fixes + 3 closest services</text>

  <!-- Step 2: triage decision (LLM) -->
  <rect x="110" y="350" width="520" height="88" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <circle cx="134" cy="375" r="13" fill="#7c3aed"/>
  <text x="134" y="379.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="156" y="380" font-size="15" font-weight="700" fill="#0f172a">Read the ticket and decide</text>
  <text x="156" y="402" font-size="13" fill="#334155">work type · service · urgency · impact · resolution status</text>
  <text x="156" y="421" font-size="13" fill="#334155">picks only allowed values; asked again to check it agrees</text>
  <rect x="566" y="362" width="52" height="22" rx="11" fill="#7c3aed"/>
  <text x="592" y="377" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">LLM</text>

  <line x1="370" y1="439" x2="370" y2="479" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="382" y="464" font-size="12" fill="#475569">5 decisions + a one-sentence reason</text>

  <!-- Step 3: fixed rules (algorithm) -->
  <rect x="110" y="482" width="520" height="106" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="134" cy="507" r="13" fill="#2563eb"/>
  <text x="134" y="511.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="156" y="512" font-size="15" font-weight="700" fill="#0f172a">Apply the fixed rules</text>
  <text x="156" y="534" font-size="13" fill="#334155"><tspan font-weight="700" fill="#0f172a">Team</tspan>  ← the team that owns the chosen service</text>
  <text x="156" y="553" font-size="13" fill="#334155"><tspan font-weight="700" fill="#0f172a">Priority</tspan>  ← official urgency × impact matrix</text>
  <text x="156" y="572" font-size="13" fill="#334155"><tspan font-weight="700" fill="#0f172a">Assignee</tspan>  ← who fixed this service's problems before</text>
  <rect x="522" y="494" width="96" height="22" rx="11" fill="#2563eb"/>
  <text x="570" y="509" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">ALGORITHM</text>

  <line x1="370" y1="589" x2="370" y2="629" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="382" y="614" font-size="12" fill="#475569">all 8 fields</text>

  <!-- Step 4: confidence and lane (algorithm) -->
  <rect x="110" y="632" width="520" height="100" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="134" cy="657" r="13" fill="#2563eb"/>
  <text x="134" y="661.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="156" y="662" font-size="15" font-weight="700" fill="#0f172a">Score confidence, pick a lane</text>
  <text x="156" y="684" font-size="13" fill="#334155">from agreement signals, never from the LLM rating itself</text>
  <rect x="156" y="696" width="124" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="171" cy="708" r="4.5" fill="#16a34a"/>
  <text x="182" y="712.5" font-size="12" fill="#0f172a">auto-apply</text>
  <rect x="290" y="696" width="124" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="305" cy="708" r="4.5" fill="#ea580c"/>
  <text x="316" y="712.5" font-size="12" fill="#0f172a">needs review</text>
  <rect x="424" y="696" width="124" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <circle cx="439" cy="708" r="4.5" fill="#dc2626"/>
  <text x="450" y="712.5" font-size="12" fill="#0f172a">human only</text>
  <rect x="522" y="644" width="96" height="22" rx="11" fill="#2563eb"/>
  <text x="570" y="659" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">ALGORITHM</text>

  <line x1="370" y1="733" x2="370" y2="773" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="382" y="758" font-size="12" fill="#475569">fields + lane</text>

  <!-- Step 5: resolution note (LLM) -->
  <rect x="110" y="776" width="520" height="88" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <circle cx="134" cy="801" r="13" fill="#7c3aed"/>
  <text x="134" y="805.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="156" y="806" font-size="15" font-weight="700" fill="#0f172a">Draft the resolution note</text>
  <text x="156" y="828" font-size="13" fill="#334155">1–2 sentences in the assignee's voice</text>
  <text x="156" y="847" font-size="13" fill="#334155">code rejects invented ticket IDs and flags unsupported details</text>
  <rect x="566" y="788" width="52" height="22" rx="11" fill="#7c3aed"/>
  <text x="592" y="803" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">LLM</text>

  <line x1="370" y1="865" x2="370" y2="905" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="382" y="890" font-size="12" fill="#475569">needs review / human only lanes</text>

  <!-- Step 6: human review -->
  <rect x="110" y="908" width="520" height="70" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="134" cy="933" r="13" fill="#b45309"/>
  <text x="134" y="937.5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
  <text x="156" y="938" font-size="15" font-weight="700" fill="#0f172a">Agent reviews the proposal</text>
  <text x="156" y="960" font-size="13" fill="#334155">accepts or corrects it; human edits are never overwritten</text>
  <rect x="550" y="920" width="68" height="22" rx="11" fill="#b45309"/>
  <text x="584" y="935" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">HUMAN</text>

  <line x1="370" y1="979" x2="370" y2="1019" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="382" y="1004" font-size="12" fill="#475569">approved or corrected</text>

  <!-- Auto-apply shortcut: skips human review -->
  <path d="M110 820 H72 V1048 H106" fill="none" stroke="#15803d" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-green)"/>
  <text x="0" y="0" font-size="12" font-weight="600" fill="#15803d" text-anchor="middle" transform="translate(62 934) rotate(-90)">auto-apply lane: no review</text>

  <!-- Output: Jira updated -->
  <rect x="110" y="1022" width="520" height="52" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="134" y="1045" font-size="15" font-weight="700" fill="#0f172a">Jira ticket updated</text>
  <text x="134" y="1064" font-size="13" fill="#334155">all fields and the resolution note are written back</text>

  <!-- Reference data cards, each feeding the step on its left -->
  <rect x="690" y="245" width="250" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="706" y="267" font-size="12.5" font-weight="600" fill="#0f172a">21 past fixes, 20 service cards</text>
  <text x="706" y="285" font-size="12.5" fill="#64748b">stored as embeddings</text>
  <line x1="689" y1="271" x2="634" y2="271" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <rect x="690" y="368" width="250" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="706" y="390" font-size="12.5" font-weight="600" fill="#0f172a">service catalogue</text>
  <text x="706" y="408" font-size="12.5" fill="#64748b">official urgency and impact rules</text>
  <line x1="689" y1="394" x2="634" y2="394" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <rect x="690" y="509" width="250" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="706" y="531" font-size="12.5" font-weight="600" fill="#0f172a">service → team table</text>
  <text x="706" y="549" font-size="12.5" fill="#64748b">priority matrix · resolver per service</text>
  <line x1="689" y1="535" x2="634" y2="535" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <rect x="690" y="656" width="250" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="706" y="678" font-size="12.5" font-weight="600" fill="#0f172a">lane policy</text>
  <text x="706" y="696" font-size="12.5" fill="#64748b">thresholds · 10% audit of auto-applies</text>
  <line x1="689" y1="682" x2="634" y2="682" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <rect x="690" y="794" width="250" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="706" y="816" font-size="12.5" font-weight="600" fill="#0f172a">similar past fixes</text>
  <text x="706" y="834" font-size="12.5" fill="#64748b">used as style examples</text>
  <line x1="689" y1="820" x2="634" y2="820" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>
